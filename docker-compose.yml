services:
  db:
    image: postgres:16-alpine
    container_name: certifix_postgres
    environment:
      POSTGRES_USER: certifix
      POSTGRES_PASSWORD: certifix_password
      POSTGRES_DB: certifix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certifix -d certifix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certifix_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://certifix:certifix_password@db:5432/certifix_db
      SECRET_KEY: change-me-in-production-to-a-strong-random-key
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      PRIVATE_STORAGE_DIR: /app/private_storage
    ports:
      - "8000:8000"
    volumes:
      - private_storage:/app/private_storage
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: certifix_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  private_storage:
